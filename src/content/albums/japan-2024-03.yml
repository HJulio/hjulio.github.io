title: Japan 2024 - Part 3
short_description: Kyoto. Fushimi Inari, Kiyomizu-dera, Arashiyama and Kinkaku-ji.
description: Third roll of the 2024 trip, shot in Kyoto. The torii tunnels of Fushimi Inari, Kiyomizu-dera and the Higashiyama streets, Yasaka shrine, the rabbits of Okazaki shrine, the bamboo grove of Arashiyama and the golden pavilion of Kinkaku-ji.
film: Kodak Gold 200
camera: Minolta X-300
